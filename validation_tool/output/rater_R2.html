<script>
(function() {
  const cfg = window.RATER_CONFIG;
  const stateKey = 'validation_' + cfg.raterId + '_state';

  // ----- State -----
  let state = loadState();
  function loadState() {
    try {
      const s = localStorage.getItem(stateKey);
      if (s) return JSON.parse(s);
    } catch(e){}
    return { completedVideos: [], draftAnswers: {}, currentVideoIndex: 0 };
  }
  function saveState() { localStorage.setItem(stateKey, JSON.stringify(state)); }

  // Find next video not yet completed
  function findNextVideoIndex() {
    for (let i = 0; i < cfg.videos.length; i++) {
      if (!state.completedVideos.includes(cfg.videos[i].internalId)) return i;
    }
    return -1; // all done
  }

  // ----- YouTube Player -----
  let player = null;
  let playerReady = false;
  window.onYouTubeIframeAPIReady = function() {
    // Will be initialized when first video loads
    initializePage();
  };

  function createPlayer(videoId) {
    if (player) {
      player.loadVideoById(videoId);
      return;
    }
    player = new YT.Player('player', {
      videoId: videoId,
      playerVars: { 'playsinline': 1, 'rel': 0, 'modestbranding': 1 },
      events: {
        'onReady': () => { playerReady = true; }
      }
    });
  }

  function jumpTo(seconds) {
    if (!player || !playerReady) return;
    player.seekTo(seconds, true);
    player.playVideo();
  }

  // ----- Render -----
  function renderVideo(idx) {
    if (idx < 0 || idx >= cfg.videos.length) { showCompletion(); return; }
    const video = cfg.videos[idx];
    document.getElementById('videoTitle').textContent = video.displayLabel;
    createPlayer(video.youtubeId);
    state.currentVideoIndex = idx;
    saveState();
    renderCPIPs(video);
    updateProgress();
  }

  function renderCPIPs(video) {
    const container = document.getElementById('cpipContainer');
    container.innerHTML = '';
    const cpips = cfg.cpips[video.internalId] || [];
    const draft = state.draftAnswers[video.internalId] || { cpips: {}, overallScore: 50, comments: '' };

    cpips.forEach((cpip, i) => {
      const saved = draft.cpips[cpip.cpipId] || {};
      const card = document.createElement('div');
      card.className = 'cpip-card';
      card.dataset.cpipId = cpip.cpipId;
      card.dataset.cpipIdx = i;
      card.innerHTML = `
        <div class="cpip-header">
          <div>
            <div class="cpip-label">CPIP ${i+1} of ${cpips.length} — ${formatTime(cpip.timestamp)}</div>
            <div class="cpip-concept">Concept: ${escapeHtml(cpip.conceptLabel)}</div>
          </div>
          <button class="jump-btn" data-t="${cpip.timestamp}">Jump to moment</button>
        </div>

        <div class="question q-zone">
          <label class="q-label">1. Zone classification (rate FIRST, before estimating delay):</label>
          <div class="zone-options">
            ${['Optimal','Suboptimal','Disruptive','Unacceptable'].map(z =>
              `<label><input type="radio" name="zone_${cpip.cpipId}" value="${z}" ${saved.zone===z?'checked':''}><span>&nbsp;${z}</span></label>`
            ).join('')}
          </div>
        </div>

        <div class="question q-delay ${saved.zone?'':'disabled'}">
          <label class="q-label">2. Perceived delay (seconds):</label>
          <input type="number" class="delay-input" name="delay_${cpip.cpipId}" step="0.1" min="-10" max="10" value="${saved.delaySeconds??''}" placeholder="e.g. 1.5 (negative = visual leads)">
          <div class="delay-hint">Negative values = visual appears before narration. 0 = perfectly synced.</div>
        </div>

        <div class="question q-conf ${saved.delaySeconds!=null && saved.delaySeconds!==''?'':'disabled'}">
          <label class="q-label">3. Confidence in your rating:</label>
          <div class="confidence-options">
            ${['High','Medium','Low'].map(c =>
              `<label><input type="radio" name="conf_${cpip.cpipId}" value="${c}" ${saved.confidence===c?'checked':''}>&nbsp;${c}</label>`
            ).join('')}
          </div>
        </div>
      `;
      container.appendChild(card);
    });

    // Overall section
    document.getElementById('overallScore').value = draft.overallScore || 50;
    document.getElementById('overallScoreVal').textContent = draft.overallScore || 50;
    document.getElementById('comments').value = draft.comments || '';

    attachCPIPHandlers(video);
    updateUnlockStates(video);
  }

  function attachCPIPHandlers(video) {
    // Jump buttons
    document.querySelectorAll('.jump-btn').forEach(btn => {
      btn.onclick = () => jumpTo(parseFloat(btn.dataset.t));
    });
    // Zone radios → unlock delay
    document.querySelectorAll('input[name^="zone_"]').forEach(el => {
      el.onchange = () => { saveDraft(video); updateUnlockStates(video); };
    });
    // Delay → unlock confidence
    document.querySelectorAll('input[name^="delay_"]').forEach(el => {
      el.oninput = () => { saveDraft(video); updateUnlockStates(video); };
    });
    // Confidence → may complete CPIP
    document.querySelectorAll('input[name^="conf_"]').forEach(el => {
      el.onchange = () => { saveDraft(video); updateUnlockStates(video); };
    });
  }

  function saveDraft(video) {
    const cpips = cfg.cpips[video.internalId] || [];
    const draft = { cpips: {}, overallScore: parseInt(document.getElementById('overallScore').value), comments: document.getElementById('comments').value };
    cpips.forEach(cpip => {
      const zone = (document.querySelector(`input[name="zone_${cpip.cpipId}"]:checked`)||{}).value || null;
      const delayEl = document.querySelector(`input[name="delay_${cpip.cpipId}"]`);
      const delay = delayEl && delayEl.value !== '' ? parseFloat(delayEl.value) : null;
      const conf = (document.querySelector(`input[name="conf_${cpip.cpipId}"]:checked`)||{}).value || null;
      draft.cpips[cpip.cpipId] = { zone, delaySeconds: delay, confidence: conf };
    });
    state.draftAnswers[video.internalId] = draft;
    saveState();
  }

  function updateUnlockStates(video) {
    const cpips = cfg.cpips[video.internalId] || [];
    const draft = state.draftAnswers[video.internalId] || { cpips: {} };
    let allCpipsComplete = true;
    cpips.forEach(cpip => {
      const card = document.querySelector(`.cpip-card[data-cpip-id="${cpip.cpipId}"]`);
      if (!card) return;
      const saved = draft.cpips[cpip.cpipId] || {};
      const qDelay = card.querySelector('.q-delay');
      const qConf = card.querySelector('.q-conf');
      if (saved.zone) qDelay.classList.remove('disabled'); else qDelay.classList.add('disabled');
      if (saved.delaySeconds != null && saved.delaySeconds !== '') qConf.classList.remove('disabled'); else qConf.classList.add('disabled');
      if (!saved.zone || saved.delaySeconds == null || saved.delaySeconds === '' || !saved.confidence) allCpipsComplete = false;
    });
    const overallSection = document.getElementById('overallSection');
    if (allCpipsComplete) overallSection.classList.remove('locked'); else overallSection.classList.add('locked');
    document.getElementById('submitBtn').disabled = !allCpipsComplete;
  }

  function updateProgress() {
    const done = state.completedVideos.length;
    const total = cfg.videos.length;
    document.getElementById('progressText').textContent = `${done} of ${total} completed`;
    document.getElementById('progressFill').style.width = (done/total*100) + '%';
  }

  // ----- Submit -----
  document.getElementById('submitBtn').onclick = async function() {
    const idx = state.currentVideoIndex;
    const video = cfg.videos[idx];
    const cpips = cfg.cpips[video.internalId] || [];
    const draft = state.draftAnswers[video.internalId];

    const payload = {
      raterId: cfg.raterId,
      videoInternalId: video.internalId,
      videoDisplayLabel: video.displayLabel,
      videoOrderIndex: idx + 1,
      overallScore: draft.overallScore,
      comments: draft.comments || '',
      clientDurationMs: Date.now() - (state.videoStartTime || Date.now()),
      cpips: cpips.map(cpip => ({
        cpipId: cpip.cpipId,
        timestamp: cpip.timestamp,
        conceptLabel: cpip.conceptLabel,
        zone: draft.cpips[cpip.cpipId].zone,
        delaySeconds: draft.cpips[cpip.cpipId].delaySeconds,
        confidence: draft.cpips[cpip.cpipId].confidence
      }))
    };

    showBanner('Submitting…', 'info');
    this.disabled = true;
    try {
      await fetch(cfg.appsScriptUrl, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      // no-cors means we can't read response; assume success
      state.completedVideos.push(video.internalId);
      delete state.draftAnswers[video.internalId];
      saveState();
      showBanner('Submitted. Loading next video…', 'success');
      setTimeout(() => {
        const next = findNextVideoIndex();
        if (next === -1) showCompletion();
        else { renderVideo(next); document.getElementById('ratingPane').scrollTop = 0; }
      }, 1000);
    } catch(e) {
      showBanner('Submit failed: ' + e.message + '. Copy the JSON below and email it as backup:<br><textarea style="width:100%;height:100px;margin-top:6px;">' + escapeHtml(JSON.stringify(payload)) + '</textarea>', 'error');
      this.disabled = false;
    }
  };

  function showBanner(msg, type) {
    const area = document.getElementById('bannerArea');
    area.innerHTML = `<div class="banner ${type}">${msg}</div>`;
    if (type !== 'error') setTimeout(() => { area.innerHTML = ''; }, 3000);
  }

  function showCompletion() {
    document.getElementById('mainContainer').style.display = 'none';
    document.getElementById('completionScreen').style.display = 'block';
    updateProgress();
  }

  // ----- Modal -----
  document.getElementById('zoneCardBtn').onclick = () => {
    document.getElementById('zoneCardContent').innerHTML = cfg.zoneCardHtml;
    document.getElementById('zoneModal').classList.add('open');
  };
  document.getElementById('closeModalBtn').onclick = () => document.getElementById('zoneModal').classList.remove('open');
  document.getElementById('zoneModal').onclick = (e) => { if(e.target.id==='zoneModal') e.currentTarget.classList.remove('open'); };

  // Overall score slider
  document.getElementById('overallScore').oninput = function() {
    document.getElementById('overallScoreVal').textContent = this.value;
    const idx = state.currentVideoIndex;
    saveDraft(cfg.videos[idx]);
  };
  document.getElementById('comments').oninput = function() {
    const idx = state.currentVideoIndex;
    saveDraft(cfg.videos[idx]);
  };

  // Warn on unload if draft exists
  window.addEventListener('beforeunload', (e) => {
    const idx = state.currentVideoIndex;
    if (idx >= 0 && idx < cfg.videos.length) {
      const video = cfg.videos[idx];
      if (state.draftAnswers[video.internalId] && !state.completedVideos.includes(video.internalId)) {
        e.preventDefault(); e.returnValue = '';
      }
    }
  });

  // Helpers
  function formatTime(s) {
    const m = Math.floor(s/60), sec = (s%60).toFixed(0).padStart(2,'0');
    return `${m}:${sec}`;
  }
  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

  function initializePage() {
    document.getElementById('raterBadge').textContent = cfg.raterId;
    const idx = findNextVideoIndex();
    if (idx === -1) { showCompletion(); return; }
    state.videoStartTime = Date.now();
    renderVideo(idx);
  }

  // If YT API already loaded before this script
  if (window.YT && window.YT.Player) initializePage();
})();
</script>
</body>
</html>
