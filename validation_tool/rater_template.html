<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1280">
<title>Expert Validation — Temporal Contiguity</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f8; color: #1a1a1a; }
  header { background: #1f2937; color: #fff; padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header .meta { display: flex; align-items: center; gap: 16px; font-size: 13px; }
  header .progress-bar { width: 220px; height: 8px; background: #374151; border-radius: 4px; overflow: hidden; }
  header .progress-fill { height: 100%; background: #10b981; transition: width 0.3s; }
  header button { background: #3b82f6; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; }
  header button:hover { background: #2563eb; }
  header .rater-badge { background: #4b5563; padding: 4px 10px; border-radius: 4px; font-weight: 600; }

  .container { display: grid; grid-template-columns: 60% 40%; height: calc(100vh - 52px); }
  .video-pane { background: #000; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; }
  .video-pane .video-title { color: #fff; font-size: 18px; margin-bottom: 12px; font-weight: 600; }
  .video-pane .video-wrapper { width: 100%; max-width: 800px; aspect-ratio: 16/9; background: #111; }
  #player { width: 100%; height: 100%; }

  .rating-pane { overflow-y: auto; padding: 20px; background: #fff; border-left: 1px solid #e5e7eb; }
  .cpip-card { border: 1px solid #e5e7eb; border-radius: 8px; padding: 16px; margin-bottom: 14px; background: #fafafa; }
  .cpip-card.locked { opacity: 0.5; pointer-events: none; }
  .cpip-card.active { border-color: #3b82f6; background: #eff6ff; }
  .cpip-card .cpip-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .cpip-card .cpip-label { font-weight: 600; font-size: 14px; }
  .cpip-card .cpip-concept { color: #6b7280; font-size: 12px; margin-top: 2px; }
  .cpip-card .jump-btn { background: #10b981; color: #fff; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-size: 12px; white-space: nowrap; }
  .cpip-card .jump-btn:hover { background: #059669; }
  .cpip-card .question { margin-top: 12px; }
  .cpip-card .question.disabled { opacity: 0.4; pointer-events: none; }
  .cpip-card .q-label { font-size: 13px; font-weight: 600; margin-bottom: 6px; display: block; }
  .cpip-card .zone-options { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .cpip-card .zone-options label { display: flex; align-items: center; padding: 8px; border: 1px solid #d1d5db; border-radius: 4px; cursor: pointer; font-size: 13px; background: #fff; }
  .cpip-card .zone-options label:hover { background: #f3f4f6; }
  .cpip-card .zone-options input[type=radio]:checked + span { font-weight: 600; }
  .cpip-card .zone-options label:has(input:checked) { background: #dbeafe; border-color: #3b82f6; }
  .cpip-card .delay-input { width: 100%; padding: 8px; border: 1px solid #d1d5db; border-radius: 4px; font-size: 14px; }
  .cpip-card .delay-hint { font-size: 11px; color: #6b7280; margin-top: 4px; }
  .cpip-card .confidence-options { display: flex; gap: 6px; }
  .cpip-card .confidence-options label { flex: 1; padding: 8px; border: 1px solid #d1d5db; border-radius: 4px; cursor: pointer; text-align: center; font-size: 13px; background: #fff; }
  .cpip-card .confidence-options label:has(input:checked) { background: #dbeafe; border-color: #3b82f6; font-weight: 600; }

  .overall-section { margin-top: 20px; padding: 16px; border: 1px solid #e5e7eb; border-radius: 8px; background: #fafafa; }
  .overall-section.locked { opacity: 0.4; pointer-events: none; }
  .overall-section h3 { margin: 0 0 12px 0; font-size: 15px; }
  .overall-section .slider-row { display: flex; align-items: center; gap: 12px; }
  .overall-section .slider-row input[type=range] { flex: 1; }
  .overall-section .slider-row .slider-value { font-weight: 600; font-size: 18px; min-width: 48px; text-align: right; }
  .overall-section textarea { width: 100%; min-height: 70px; padding: 8px; border: 1px solid #d1d5db; border-radius: 4px; font-family: inherit; font-size: 13px; resize: vertical; margin-top: 12px; }

  .submit-btn { width: 100%; margin-top: 16px; padding: 14px; background: #10b981; color: #fff; border: none; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; }
  .submit-btn:hover { background: #059669; }
  .submit-btn:disabled { background: #9ca3af; cursor: not-allowed; }

  .banner { padding: 10px 14px; border-radius: 6px; margin-bottom: 12px; font-size: 13px; }
  .banner.success { background: #d1fae5; color: #065f46; border: 1px solid #10b981; }
  .banner.error { background: #fee2e2; color: #991b1b; border: 1px solid #ef4444; }
  .banner.info { background: #dbeafe; color: #1e40af; border: 1px solid #3b82f6; }

  .completion-screen { padding: 40px; text-align: center; }
  .completion-screen h2 { color: #10b981; }

  .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 1000; display: none; align-items: center; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: #fff; max-width: 720px; width: 90%; max-height: 85vh; overflow-y: auto; border-radius: 8px; padding: 24px; }
  .modal h2 { margin-top: 0; }
  .modal .close-btn { float: right; background: #e5e7eb; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; }
  .modal .zone-def { margin-bottom: 14px; padding: 12px; border-left: 4px solid #d1d5db; background: #f9fafb; }
  .modal .zone-def.optimal { border-left-color: #10b981; }
  .modal .zone-def.suboptimal { border-left-color: #f59e0b; }
  .modal .zone-def.disruptive { border-left-color: #f97316; }
  .modal .zone-def.unacceptable { border-left-color: #ef4444; }
  .modal .zone-def strong { display: block; margin-bottom: 4px; font-size: 14px; }
  .modal .zone-def p { margin: 0; font-size: 13px; color: #4b5563; }
</style>
</head>
<body>

<header>
  <h1>Expert Validation — Temporal Contiguity</h1>
  <div class="meta">
    <button id="zoneCardBtn">View zone reference</button>
    <div>
      <span id="progressText">Loading…</span>
      <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
    </div>
    <span class="rater-badge" id="raterBadge">R?</span>
  </div>
</header>

<div class="container" id="mainContainer">
  <div class="video-pane">
    <div class="video-title" id="videoTitle">Loading…</div>
    <div class="video-wrapper"><div id="player"></div></div>
  </div>
  <div class="rating-pane" id="ratingPane">
    <div id="bannerArea"></div>
    <div id="cpipContainer"></div>
    <div class="overall-section locked" id="overallSection">
      <h3>Overall video quality</h3>
      <div class="slider-row">
        <input type="range" id="overallScore" min="0" max="100" value="50" step="1">
        <span class="slider-value" id="overallScoreVal">50</span>
      </div>
      <label style="display:block;margin-top:12px;font-size:13px;font-weight:600;">Comments (optional)</label>
      <textarea id="comments" placeholder="Any observations about this video's visual-narration synchronisation…"></textarea>
    </div>
    <button class="submit-btn" id="submitBtn" disabled>Submit video ratings</button>
  </div>
</div>

<div class="completion-screen" id="completionScreen" style="display:none;">
  <h2>All 20 videos completed. Thank you!</h2>
  <p>Your ratings have been recorded. You may close this window.</p>
</div>

<!-- Zone reference modal -->
<div class="modal-overlay" id="zoneModal">
  <div class="modal">
    <button class="close-btn" id="closeModalBtn">Close</button>
    <div id="zoneCardContent"></div>
  </div>
</div>

<!-- YouTube IFrame API -->
<script src="https://www.youtube.com/iframe_api"></script>

<!-- RATER_CONFIG injected by generate_rater_copies.py -->
<script id="rater-config">
window.RATER_CONFIG = {
  "raterId": "R0_TEMPLATE",
  "appsScriptUrl": "REPLACE_ME_APPS_SCRIPT_URL",
  "videos": [
    {"displayLabel": "Video_R01", "internalId": "A0", "youtubeId": "dQw4w9WgXcQ", "duration": 240}
  ],
  "cpips": {
    "A0": [
      {"cpipId": "A0_c1", "timestamp": 15.0, "conceptLabel": "Example concept"}
    ]
  },
  "zoneCardHtml": "<h2>Zone Reference Card</h2><div class='zone-def optimal'><strong>Optimal</strong><p>Visual and narration are perceived as happening together; no cognitive effort to bridge them.</p></div>"
};
</script>

<script>
(function() {
  const cfg = window.RATER_CONFIG;
  const stateKey = 'validation_' + cfg.raterId + '_state';

  // ----- State -----
  let state = loadState();
  function loadState() {
    try {
      const s = localStorage.getItem(stateKey);
      if (s) return JSON.parse(s);
    } catch(e){}
    return { completedVideos: [], draftAnswers: {}, currentVideoIndex: 0 };
  }
  function saveState() { localStorage.setItem(stateKey, JSON.stringify(state)); }

  // Find next video not yet completed
  function findNextVideoIndex() {
    for (let i = 0; i < cfg.videos.length; i++) {
      if (!state.completedVideos.includes(cfg.videos[i].internalId)) return i;
    }
    return -1; // all done
  }

  // ----- YouTube Player -----
  let player = null;
  let playerReady = false;
  window.onYouTubeIframeAPIReady = function() {
    // Will be initialized when first video loads
    initializePage();
  };

  function createPlayer(videoId) {
    if (player) {
      player.loadVideoById(videoId);
      return;
    }
    player = new YT.Player('player', {
      videoId: videoId,
      playerVars: { 'playsinline': 1, 'rel': 0, 'modestbranding': 1 },
      events: {
        'onReady': () => { playerReady = true; }
      }
    });
  }

  function jumpTo(seconds) {
    if (!player || !playerReady) return;
    player.seekTo(seconds, true);
    player.playVideo();
  }

  // ----- Render -----
  function renderVideo(idx) {
    if (idx < 0 || idx >= cfg.videos.length) { showCompletion(); return; }
    const video = cfg.videos[idx];
    document.getElementById('videoTitle').textContent = video.displayLabel;
    createPlayer(video.youtubeId);
    state.currentVideoIndex = idx;
    saveState();
    renderCPIPs(video);
    updateProgress();
  }

  function renderCPIPs(video) {
    const container = document.getElementById('cpipContainer');
    container.innerHTML = '';
    const cpips = cfg.cpips[video.internalId] || [];
    const draft = state.draftAnswers[video.internalId] || { cpips: {}, overallScore: 50, comments: '' };

    cpips.forEach((cpip, i) => {
      const saved = draft.cpips[cpip.cpipId] || {};
      const card = document.createElement('div');
      card.className = 'cpip-card';
      card.dataset.cpipId = cpip.cpipId;
      card.dataset.cpipIdx = i;
      card.innerHTML = `
        <div class="cpip-header">
          <div>
            <div class="cpip-label">CPIP ${i+1} of ${cpips.length} — ${formatTime(cpip.timestamp)}</div>
            <div class="cpip-concept">Concept: ${escapeHtml(cpip.conceptLabel)}</div>
          </div>
          <button class="jump-btn" data-t="${cpip.timestamp}">Jump to moment</button>
        </div>

        <div class="question q-zone">
          <label class="q-label">1. Zone classification (rate FIRST, before estimating delay):</label>
          <div class="zone-options">
            ${['Optimal','Suboptimal','Disruptive','Unacceptable'].map(z =>
              `<label><input type="radio" name="zone_${cpip.cpipId}" value="${z}" ${saved.zone===z?'checked':''}><span>&nbsp;${z}</span></label>`
            ).join('')}
          </div>
        </div>

        <div class="question q-delay ${saved.zone?'':'disabled'}">
          <label class="q-label">2. Perceived delay (seconds):</label>
          <input type="number" class="delay-input" name="delay_${cpip.cpipId}" step="0.1" min="-10" max="10" value="${saved.delaySeconds??''}" placeholder="e.g. 1.5 (negative = visual leads)">
          <div class="delay-hint">Negative values = visual appears before narration. 0 = perfectly synced.</div>
        </div>

        <div class="question q-conf ${saved.delaySeconds!=null && saved.delaySeconds!==''?'':'disabled'}">
          <label class="q-label">3. Confidence in your rating:</label>
          <div class="confidence-options">
            ${['High','Medium','Low'].map(c =>
              `<label><input type="radio" name="conf_${cpip.cpipId}" value="${c}" ${saved.confidence===c?'checked':''}>&nbsp;${c}</label>`
            ).join('')}
          </div>
        </div>
      `;
      container.appendChild(card);
    });

    // Overall section
    document.getElementById('overallScore').value = draft.overallScore || 50;
    document.getElementById('overallScoreVal').textContent = draft.overallScore || 50;
    document.getElementById('comments').value = draft.comments || '';

    attachCPIPHandlers(video);
    updateUnlockStates(video);
  }

  function attachCPIPHandlers(video) {
    // Jump buttons
    document.querySelectorAll('.jump-btn').forEach(btn => {
      btn.onclick = () => jumpTo(parseFloat(btn.dataset.t));
    });
    // Zone radios → unlock delay
    document.querySelectorAll('input[name^="zone_"]').forEach(el => {
      el.onchange = () => { saveDraft(video); updateUnlockStates(video); };
    });
    // Delay → unlock confidence
    document.querySelectorAll('input[name^="delay_"]').forEach(el => {
      el.oninput = () => { saveDraft(video); updateUnlockStates(video); };
    });
    // Confidence → may complete CPIP
    document.querySelectorAll('input[name^="conf_"]').forEach(el => {
      el.onchange = () => { saveDraft(video); updateUnlockStates(video); };
    });
  }

  function saveDraft(video) {
    const cpips = cfg.cpips[video.internalId] || [];
    const draft = { cpips: {}, overallScore: parseInt(document.getElementById('overallScore').value), comments: document.getElementById('comments').value };
    cpips.forEach(cpip => {
      const zone = (document.querySelector(`input[name="zone_${cpip.cpipId}"]:checked`)||{}).value || null;
      const delayEl = document.querySelector(`input[name="delay_${cpip.cpipId}"]`);
      const delay = delayEl && delayEl.value !== '' ? parseFloat(delayEl.value) : null;
      const conf = (document.querySelector(`input[name="conf_${cpip.cpipId}"]:checked`)||{}).value || null;
      draft.cpips[cpip.cpipId] = { zone, delaySeconds: delay, confidence: conf };
    });
    state.draftAnswers[video.internalId] = draft;
    saveState();
  }

  function updateUnlockStates(video) {
    const cpips = cfg.cpips[video.internalId] || [];
    const draft = state.draftAnswers[video.internalId] || { cpips: {} };
    let allCpipsComplete = true;
    cpips.forEach(cpip => {
      const card = document.querySelector(`.cpip-card[data-cpip-id="${cpip.cpipId}"]`);
      if (!card) return;
      const saved = draft.cpips[cpip.cpipId] || {};
      const qDelay = card.querySelector('.q-delay');
      const qConf = card.querySelector('.q-conf');
      if (saved.zone) qDelay.classList.remove('disabled'); else qDelay.classList.add('disabled');
      if (saved.delaySeconds != null && saved.delaySeconds !== '') qConf.classList.remove('disabled'); else qConf.classList.add('disabled');
      if (!saved.zone || saved.delaySeconds == null || saved.delaySeconds === '' || !saved.confidence) allCpipsComplete = false;
    });
    const overallSection = document.getElementById('overallSection');
    if (allCpipsComplete) overallSection.classList.remove('locked'); else overallSection.classList.add('locked');
    document.getElementById('submitBtn').disabled = !allCpipsComplete;
  }

  function updateProgress() {
    const done = state.completedVideos.length;
    const total = cfg.videos.length;
    document.getElementById('progressText').textContent = `${done} of ${total} completed`;
    document.getElementById('progressFill').style.width = (done/total*100) + '%';
  }

  // ----- Submit -----
  document.getElementById('submitBtn').onclick = async function() {
    const idx = state.currentVideoIndex;
    const video = cfg.videos[idx];
    const cpips = cfg.cpips[video.internalId] || [];
    const draft = state.draftAnswers[video.internalId];

    const payload = {
      raterId: cfg.raterId,
      videoInternalId: video.internalId,
      videoDisplayLabel: video.displayLabel,
      videoOrderIndex: idx + 1,
      overallScore: draft.overallScore,
      comments: draft.comments || '',
      clientDurationMs: Date.now() - (state.videoStartTime || Date.now()),
      cpips: cpips.map(cpip => ({
        cpipId: cpip.cpipId,
        timestamp: cpip.timestamp,
        conceptLabel: cpip.conceptLabel,
        zone: draft.cpips[cpip.cpipId].zone,
        delaySeconds: draft.cpips[cpip.cpipId].delaySeconds,
        confidence: draft.cpips[cpip.cpipId].confidence
      }))
    };

    showBanner('Submitting…', 'info');
    this.disabled = true;
    try {
      await fetch(cfg.appsScriptUrl, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      // no-cors means we can't read response; assume success
      state.completedVideos.push(video.internalId);
      delete state.draftAnswers[video.internalId];
      saveState();
      showBanner('Submitted. Loading next video…', 'success');
      setTimeout(() => {
        const next = findNextVideoIndex();
        if (next === -1) showCompletion();
        else { renderVideo(next); document.getElementById('ratingPane').scrollTop = 0; }
      }, 1000);
    } catch(e) {
      showBanner('Submit failed: ' + e.message + '. Copy the JSON below and email it as backup:<br><textarea style="width:100%;height:100px;margin-top:6px;">' + escapeHtml(JSON.stringify(payload)) + '</textarea>', 'error');
      this.disabled = false;
    }
  };

  function showBanner(msg, type) {
    const area = document.getElementById('bannerArea');
    area.innerHTML = `<div class="banner ${type}">${msg}</div>`;
    if (type !== 'error') setTimeout(() => { area.innerHTML = ''; }, 3000);
  }

  function showCompletion() {
    document.getElementById('mainContainer').style.display = 'none';
    document.getElementById('completionScreen').style.display = 'block';
    updateProgress();
  }

  // ----- Modal -----
  document.getElementById('zoneCardBtn').onclick = () => {
    document.getElementById('zoneCardContent').innerHTML = cfg.zoneCardHtml;
    document.getElementById('zoneModal').classList.add('open');
  };
  document.getElementById('closeModalBtn').onclick = () => document.getElementById('zoneModal').classList.remove('open');
  document.getElementById('zoneModal').onclick = (e) => { if(e.target.id==='zoneModal') e.currentTarget.classList.remove('open'); };

  // Overall score slider
  document.getElementById('overallScore').oninput = function() {
    document.getElementById('overallScoreVal').textContent = this.value;
    const idx = state.currentVideoIndex;
    saveDraft(cfg.videos[idx]);
  };
  document.getElementById('comments').oninput = function() {
    const idx = state.currentVideoIndex;
    saveDraft(cfg.videos[idx]);
  };

  // Warn on unload if draft exists
  window.addEventListener('beforeunload', (e) => {
    const idx = state.currentVideoIndex;
    if (idx >= 0 && idx < cfg.videos.length) {
      const video = cfg.videos[idx];
      if (state.draftAnswers[video.internalId] && !state.completedVideos.includes(video.internalId)) {
        e.preventDefault(); e.returnValue = '';
      }
    }
  });

  // Helpers
  function formatTime(s) {
    const m = Math.floor(s/60), sec = (s%60).toFixed(0).padStart(2,'0');
    return `${m}:${sec}`;
  }
  function escapeHtml(s) { return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c])); }

  function initializePage() {
    document.getElementById('raterBadge').textContent = cfg.raterId;
    const idx = findNextVideoIndex();
    if (idx === -1) { showCompletion(); return; }
    state.videoStartTime = Date.now();
    renderVideo(idx);
  }

  // If YT API already loaded before this script
  if (window.YT && window.YT.Player) initializePage();
})();
</script>
</body>
</html>
